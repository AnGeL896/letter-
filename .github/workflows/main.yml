name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/surprise/letter src/main/resources/META-INF
          mv LetterMod.java src/main/java/com/surprise/letter/
          mv mods.toml src/main/resources/META-INF/
          echo '{"pack":{"description":"Letter","pack_format":15}}' > src/main/resources/pack.mcmeta

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: letter-mod
          path: build/libs/*.jar
